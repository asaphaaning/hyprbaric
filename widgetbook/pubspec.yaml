name: hyprbaric_widgetbook
description: An isolated catalog for Hyprbaric's production Flutter widgets.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  hyprbaric:
    path: ..
  iconsax_flutter: ^1.0.1
  riverpod: ^3.3.2
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  widgetbook_generator: ^3.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/wallpaper-demo.png
  fonts:
    - family: Inter
      fonts:
        # Mirrors the app's declaration exactly. A single untagged entry makes
        # Flutter treat the family as weight 400 and approximate the rest, so
        # the catalog would render every weight differently from the bar.
        - asset: assets/fonts/InterVariable.ttf
          weight: 100
        - asset: assets/fonts/InterVariable.ttf
          weight: 200
        - asset: assets/fonts/InterVariable.ttf
          weight: 300
        - asset: assets/fonts/InterVariable.ttf
          weight: 400
        - asset: assets/fonts/InterVariable.ttf
          weight: 500
        - asset: assets/fonts/InterVariable.ttf
          weight: 600
        - asset: assets/fonts/InterVariable.ttf
          weight: 700
        - asset: assets/fonts/InterVariable.ttf
          weight: 800
        - asset: assets/fonts/InterVariable.ttf
          weight: 900
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-ExtraBold.ttf
          weight: 800
