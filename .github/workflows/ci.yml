name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang cmake libdbus-1-dev libgtk-3-dev libgtk-layer-shell-dev \
            libwayland-dev ninja-build pkg-config

      - name: Resolve Flutter dependencies
        run: ./tool/resolve-flutter-dependencies

      - name: Install RINF code generator
        run: cargo install rinf_cli --version 8.10.0 --locked

      - name: Generate bindings
        run: rinf gen

      - name: Verify generated Dart and formatting
        run: ./tool/verify-dart-sources

      - name: Verify Flutter
        run: |
          flutter analyze
          flutter test

      - name: Verify native input regions
        run: |
          mkdir -p build/native-tests
          c++ -std=c++14 -O2 -Wall -Wextra -Werror \
            -I"$FLUTTER_ROOT/bin/cache/artifacts/engine/linux-x64" \
            linux/runner/hit_region_geometry.cc \
            linux/runner/hit_region_geometry_test.cc \
            -o build/native-tests/hit_region_geometry_test \
            $(pkg-config --cflags --libs gtk+-3.0)
          build/native-tests/hit_region_geometry_test

      - name: Verify Rust
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked

      # The catalog is a separate package. Nothing above compiles it, and
      # lib/widget_catalog.dart is unreachable from the app's own tests, so
      # without this step a catalog that does not build reaches a release tag.
      - name: Verify widget catalog
        working-directory: widgetbook
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/main.directories.g.dart
          flutter analyze
          flutter test
